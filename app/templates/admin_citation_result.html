{% extends "base.html" %}
{% block title %}Citation update — ChemRepro{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto mt-16 bg-white border border-slate-200 rounded-2xl p-8 text-center">
  {% if already_done %}
  <div class="w-12 h-12 rounded-full bg-amber-50 border border-amber-200 flex items-center justify-center mx-auto mb-4">
    <svg class="w-6 h-6 text-amber-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M12 3a9 9 0 100 18A9 9 0 0012 3z"/>
    </svg>
  </div>
  <h1 class="text-lg font-semibold text-slate-800 mb-2">Nothing to do</h1>
  {% else %}
  <div class="w-12 h-12 rounded-full bg-green-50 border border-green-200 flex items-center justify-center mx-auto mb-4">
    <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
    </svg>
  </div>
  <h1 class="text-lg font-semibold text-slate-800 mb-2">Citation updated</h1>
  {% endif %}
  <p class="text-sm text-slate-500 mb-6">{{ msg }}</p>
  <a href="{{ paper_url }}"
     class="inline-flex items-center gap-2 px-5 py-2 bg-brand text-white rounded-lg text-sm font-medium hover:bg-brand-dark transition-colors">
    View paper
  </a>
</div>
{% endblock %}
