{% extends design_base(request) %}
{% block title %}Edit review – ChemRepro{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">

  <div class="mb-6">
    <a href="/paper/{{ paper.doi }}" class="text-sm text-slate-400 hover:text-brand transition-colors">← Back to paper</a>
    <h1 class="text-xl font-bold text-slate-800 mt-2">Edit your review</h1>
    <p class="text-sm text-slate-500 mt-1 truncate">{{ paper.title }}</p>
  </div>

  <form action="/paper/{{ paper.doi }}/ratings/{{ rating.id }}/edit" method="post"
        class="bg-white border border-slate-200 rounded-xl p-6 space-y-6">

    <!-- Outcome -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-3">
        What did you attempt? <span class="text-red-500">*</span>
      </label>
      <div class="flex flex-col gap-2">
        {% for val in outcome_order %}
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="outcome" value="{{ val }}" class="accent-brand w-4 h-4"
            {% if rating.outcome == val %}checked{% endif %} />
          <span class="text-sm text-slate-800">
            <span class="font-bold">{{ outcome_scores[val] }}</span>
            <span class="text-slate-400 mx-0.5">–</span>{{ outcome_labels[val] }}
          </span>
        </label>
        {% endfor %}
      </div>
    </div>

    <!-- Reproducibility observation -->
    <div>
      <label class="block text-xs font-medium text-slate-600 mb-1">Reproducibility observation</label>
      <textarea name="reproducibility_observation" rows="6" maxlength="1000" spellcheck="true"
        placeholder="{{ prompts.REPRO_OBSERVATION }}"
        class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand resize-y">{{ rating.reproducibility_observation or '' }}</textarea>
    </div>

    <!-- Scope level -->
    <div>
      <label class="block text-xs font-medium text-slate-600 mb-2">Scope extension level</label>
      <div class="flex gap-3">
        {% for lvl in ['minor', 'medium', 'major'] %}
        <label class="flex items-center gap-1.5 cursor-pointer text-sm text-slate-700">
          <input type="radio" name="scope_level" value="{{ lvl }}" class="accent-brand"
            {% if rating.scope_level == lvl %}checked{% endif %} />
          {{ lvl | title }}
        </label>
        {% endfor %}
        <label class="flex items-center gap-1.5 cursor-pointer text-sm text-slate-400">
          <input type="radio" name="scope_level" value="" class="accent-brand"
            {% if not rating.scope_level %}checked{% endif %} />
          None
        </label>
      </div>
    </div>

    <!-- Scope observation -->
    <div>
      <label class="block text-xs font-medium text-slate-600 mb-1">Scope observation</label>
      <textarea name="scope_observation" rows="6" maxlength="1000" spellcheck="true"
        placeholder="{{ prompts.SCOPE_OBSERVATION }}"
        class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand resize-y">{{ rating.scope_observation or '' }}</textarea>
    </div>

    <!-- Modification details -->
    <div>
      <label class="block text-xs font-medium text-slate-600 mb-1">Modification details</label>
      <textarea name="modification_details" rows="5" maxlength="1000" spellcheck="true"
        placeholder="{{ prompts.MODIFICATION_DETAILS }}"
        class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand resize-y">{{ rating.modification_details or '' }}</textarea>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit"
        class="bg-brand text-white rounded-lg px-6 py-2.5 text-sm font-medium hover:bg-blue-700 transition-colors">
        Save changes
      </button>
      <a href="/paper/{{ paper.doi }}#review-{{ rating.id }}"
        class="text-sm text-slate-400 hover:text-slate-600 px-4 py-2.5">
        Cancel
      </a>
    </div>
  </form>

</div>
{% endblock %}
