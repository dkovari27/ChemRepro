<div class="relative">
  <button type="button" title="Share" id="share-{{ r.id }}"
    onclick="toggleSharePopup({{ r.id }})"
    class="flex items-center gap-1 text-xs text-slate-400 hover:text-brand transition-colors">
    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/>
      <polygon points="22,2 15,22 11,13 2,9" fill="none"/>
    </svg>
  </button>
  <div id="share-popup-{{ r.id }}"
       class="hidden absolute bottom-7 left-0 bg-white border border-slate-200 rounded-xl shadow-lg p-3 z-30 w-40">
    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">Share</p>
    <div class="flex flex-col gap-0.5">
      <button type="button" onclick="shareEmail({{ r.id }}, {{ paper.doi | tojson | forceescape }})"
        class="text-xs text-slate-600 hover:text-red-500 hover:bg-red-50 rounded-lg px-2 py-1.5 transition-colors text-left w-full">
        Email
      </button>
      <button type="button" onclick="shareLinkedIn({{ r.id }}, {{ paper.doi | tojson | forceescape }})"
        class="text-xs text-slate-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg px-2 py-1.5 transition-colors text-left w-full">
        LinkedIn
      </button>
      <div class="border-t border-slate-100 mt-1 pt-1">
        <button type="button" onclick="copyReviewLink({{ r.id }}, {{ paper.doi | tojson | forceescape }})" id="copy-btn-{{ r.id }}"
          class="text-xs text-slate-600 hover:text-brand hover:bg-blue-50 rounded-lg px-2 py-1.5 transition-colors text-left w-full">
          Copy link
        </button>
      </div>
    </div>
  </div>
</div>
